[project]
name = "asx-engine"
version = "0.1.0"
description = "ASX Announcement Intelligence Engine — ingestion, extraction, and evaluation pipeline over ASX company announcements"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Taylor Hobbs" }]
dependencies = [
    "anthropic>=0.69",
    # Exports .env into the process environment for client libraries (the
    # anthropic SDK reads ANTHROPIC_API_KEY from os.environ, not from .env).
    # Already a transitive dep of pydantic-settings; declared because we
    # import it directly.
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "google-cloud-storage>=2.18",
    "google-cloud-bigquery>=3.26",
    "polars>=1.12",
    "structlog>=24.4",
    "beautifulsoup4>=4.12",
    # IANA timezone database for zoneinfo — bundled on Linux, absent on
    # Windows; announcement times are published in Australia/Sydney local.
    "tzdata>=2024.2",
    "yfinance>=1.5.1",
    "pandas>=3.0.3",
    "numpy>=2.5.1",
    "db-dtypes>=1.7.0",
    "ib-insync>=0.9.86",
]

[dependency-groups]
# Dev-only tools live in a PEP 735 dependency group: installed by `uv sync`
# locally and in CI, but never shipped as package requirements.
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-beautifulsoup4>=4.12",
    "pandas-stubs>=3.0.3.260530",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The src/ layout (code under src/asx_engine rather than asx_engine at the
# repo root) forces tests to import the *installed* package, not whatever
# happens to be in the working directory — catching packaging mistakes early.
[tool.hatch.build.targets.wheel]
packages = ["src/asx_engine"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# A curated-but-strict baseline: pycodestyle/pyflakes (E,W,F), import sorting
# (I), naming (N), modernization (UP), bugbear's likely-bugs (B), comprehension
# cleanups (C4), and pathlib-over-os.path (PTH).
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Verbatim API captures must not be reflowed to satisfy line length —
# fixture fidelity beats style in test data.
"tests/test_asx_client.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["asx_engine"]
mypy_path = "src"

# google-cloud-storage, pdfplumber and yfinance ship no py.typed (unlike
# google-cloud-bigquery), so their objects are Any. Acceptable: our wrappers
# around them are thin and the integrations are exercised by tests (pdfplumber
# against real synthesized PDFs) or against the real service.
[[tool.mypy.overrides]]
module = [
    "google.cloud.storage.*",
    "google.cloud.storage",
    "pdfplumber.*",
    "pdfplumber",
    "yfinance.*",
    "yfinance",
    "ib_insync.*",
    "ib_insync",
]
ignore_missing_imports = true

# ib_insync ships py.typed but leaves many methods untyped; the broker wrapper
# is the one module allowed to call them. It is exercised against the real
# paper gateway, never in CI.
[[tool.mypy.overrides]]
module = ["asx_engine.trading.paper_broker"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
